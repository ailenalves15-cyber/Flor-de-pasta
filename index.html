<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Flor de Pasta</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            background: #f5f5f5;

            color: #171717;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .app {

            max-width: 700px;

            margin: auto;

        }


        /* ==========================================
           ENCABEZADO
        ========================================== */

        .encabezado {

            background: #ffffff;

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 18px;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }


        .encabezado img {

            width: 75px;

            height: 75px;

            object-fit: contain;

            vertical-align: middle;

            margin-right: 8px;

        }


        .encabezado h1 {

            margin: 0;

            font-size: 30px;

            font-weight: 800;

        }


        .subtitulo {

            margin-top: 8px;

            color: #666;

            font-size: 15px;

        }


        /* ==========================================
           TARJETAS
        ========================================== */

        .tarjeta {

            background: #ffffff;

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 18px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.07);

        }


        .tarjeta h2 {

            margin-top: 0;

            font-size: 21px;

        }


        .tarjeta h3 {

            margin-top: 0;

        }


        /* ==========================================
           INPUTS
        ========================================== */

        input,
        select {

            width: 100%;

            padding: 13px;

            margin-top: 7px;

            margin-bottom: 12px;

            border: 1px solid #d5d5d5;

            border-radius: 10px;

            font-size: 16px;

            background: #ffffff;

            color: #171717;

        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #f47b20;

            box-shadow:
                0 0 0 3px rgba(244,123,32,0.15);

        }


        label {

            font-weight: 600;

            font-size: 14px;

        }


        /* ==========================================
           BOTONES
        ========================================== */

        button {

            width: 100%;

            padding: 13px 16px;

            margin-top: 7px;

            margin-bottom: 7px;

            border: none;

            border-radius: 11px;

            background: #171717;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.1s,
                opacity 0.2s;

        }


        button:hover {

            opacity: 0.9;

        }


        button:active {

            transform: scale(0.98);

        }


        /* ==========================================
           BOTONES NARANJAS
        ========================================== */

        button[onclick="abrirEscaner()"],
        button[onclick="agregarVenta()"],
        button[onclick="finalizarVenta()"] {

            background: #f47b20;

            color: #ffffff;

        }


        /* ==========================================
           ESCÁNER
        ========================================== */

        #lectorCodigo {

            margin-top: 15px;

            padding: 15px;

            background: #171717;

            border-radius: 15px;

            text-align: center;

        }


        #reader {

            width: 100% !important;

            max-width: 400px;

            margin: auto;

            border-radius: 10px;

            overflow: hidden;

        }


        #lectorCodigo button {

            background: #ffffff;

            color: #171717;

        }


        /* ==========================================
           RESULTADO PRODUCTO
        ========================================== */

        #resultado {

            margin-top: 15px;

        }


        #resultado h3 {

            margin-bottom: 5px;

            color: #f47b20;

        }


        #cantidadProducto {

            margin-top: 15px;

            padding: 18px;

            background: #fafafa;

            border-radius: 14px;

            border: 1px solid #eeeeee;

        }


        /* ==========================================
           VENTA ACTUAL
        ========================================== */

        #venta {

            margin-top: 15px;

        }


        #venta > div {

            background: #fafafa;

            border: 1px solid #eeeeee;

            border-left: 5px solid #f47b20;

            border-radius: 12px;

            padding: 13px;

            margin-bottom: 10px;

        }


        #venta p {

            margin: 5px 0;

            line-height: 1.5;

        }


        #venta button {

            width: auto;

            padding: 8px 12px;

            font-size: 13px;

            background: #171717;

        }


        /* ==========================================
           TOTAL
        ========================================== */

        #total {

            background: #171717;

            color: #ffffff;

            padding: 18px;

            border-radius: 14px;

            text-align: center;

            margin-top: 18px;

            font-size: 25px;

        }


        /* ==========================================
           VACIAR VENTA
        ========================================== */

        button[onclick="vaciarVenta()"] {

            background: #eeeeee;

            color: #171717;

        }


        /* ==========================================
           MEDIO DE PAGO
        ========================================== */

        #medioPago {

            margin-bottom: 15px;

        }


        /* ==========================================
           MENSAJES
        ========================================== */

        #mensaje {

            text-align: center;

            font-weight: 600;

            margin-top: 12px;

            padding: 8px;

        }


        #cargandoPrecios {

            text-align: center;

            padding: 10px;

        }


        /* ==========================================
           HISTORIAL Y REPORTE
        ========================================== */

        #historialVentas,
        #reporteMensualContainer {

            margin-top: 15px;

            background: #ffffff;

            padding: 18px;

            border-radius: 15px;

        }


        #historialVentas h2,
        #reporteMensualContainer h2 {

            color: #171717;

            border-bottom:
                3px solid #f47b20;

            padding-bottom: 10px;

        }


        #ventasDelDia > div {

            background: #fafafa;

            border-radius: 12px;

            padding: 13px;

            margin-bottom: 10px;

            border: 1px solid #eeeeee;

        }


        #ventasDelDia button {

            font-size: 14px;

            padding: 9px;

        }


        #totalDia {

            background: #f47b20;

            color: #ffffff;

            padding: 15px;

            border-radius: 12px;

            text-align: center;

        }


        /* ==========================================
           REPORTE
        ========================================== */

        #reporteMensual {

            margin-top: 15px;

            line-height: 1.6;

        }


        #reporteMensual p {

            background: #fafafa;

            padding: 10px;

            border-radius: 10px;

        }


        /* ==========================================
           SEPARADORES
        ========================================== */

        hr {

            border: none;

            border-top:
                1px solid #e5e5e5;

            margin: 22px 0;

        }


        /* ==========================================
           CELULAR
        ========================================== */

        @media (max-width: 600px) {

            body {

                padding: 10px;

            }


            .encabezado {

                padding: 15px;

            }


            .encabezado h1 {

                font-size: 25px;

            }


            .encabezado img {

                width: 60px;

                height: 60px;

            }


            .tarjeta {

                padding: 15px;

                border-radius: 15px;

            }


            button {

                min-height: 48px;

            }


            input,
            select {

                min-height: 48px;

            }


            #total {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- ==========================================
         ENCABEZADO
    ========================================== -->

    <div class="encabezado">

        <h1>

            <img
                src="Logo.png"
                alt="Flor de Pasta"
            >

            Flor de Pasta

        </h1>

        <div class="subtitulo">

            Registro de ventas

        </div>

    </div>


    <!-- ==========================================
         BUSCAR PRODUCTO
    ========================================== -->

    <div class="tarjeta">

        <h2>🔎 Buscar producto</h2>


        <input
            type="text"
            id="codigo"
            placeholder="Escaneá o escribí el código"
        >


        <button onclick="abrirEscaner()">

            📷 Escanear código

        </button>


        <div
            id="lectorCodigo"
            style="display: none;"
        >

            <div id="reader"></div>


            <button onclick="cerrarEscaner()">

                ❌ Cerrar escáner

            </button>

        </div>


        <button onclick="buscarProducto()">

            🔎 Buscar producto

        </button>


        <div id="resultado"></div>


        <div
            id="cantidadProducto"
            style="display: none;"
        >

            <div id="formaVentaContainer">

                <label for="formaVenta">

                    Forma de venta:

                </label>


                <select id="formaVenta">

                    <option value="unidad">
                        Unidad
                    </option>

                    <option value="docena">
                        Docena
                    </option>

                </select>

            </div>


            <label for="cantidad">

                Cantidad:

            </label>


            <input
                type="text"
                id="cantidad"
                value="1"
                inputmode="decimal"
                placeholder="Ej: 0,5"
            >


            <span id="unidadCantidad">

                unidad

            </span>


            <button onclick="agregarVenta()">

                ➕ Agregar a la venta

            </button>

        </div>

    </div>


    <!-- ==========================================
         VENTA ACTUAL
    ========================================== -->

    <div class="tarjeta">

        <h2>🛒 Venta actual</h2>


        <div id="venta"></div>


        <h2 id="total">

            Total: $0

        </h2>


        <button onclick="vaciarVenta()">

            🗑️ Vaciar venta

        </button>


        <h3>💳 Medio de pago</h3>


        <select id="medioPago">

            <option value="Efectivo">
                Efectivo
            </option>

            <option value="Transferencia">
                Transferencia
            </option>

            <option value="Tarjeta">
                Tarjeta
            </option>

        </select>


        <button onclick="finalizarVenta()">

            ✅ Finalizar venta

        </button>

    </div>


    <!-- ==========================================
         PRECIOS
    ========================================== -->

    <div class="tarjeta">

        <button
            onclick="actualizarPreciosDesdeGoogle()"
        >

            🔄 Actualizar precios

        </button>


        <div id="mensaje"></div>


        <div
            id="cargandoPrecios"
            style="display: none;"
        >

            ⏳ Actualizando precios...

        </div>

    </div>


    <!-- ==========================================
         HISTORIAL
    ========================================== -->

    <div class="tarjeta">

        <button onclick="alternarHistorial()">

            📋 Ver / ocultar historial de ventas

        </button>


        <div
            id="historialVentas"
            style="display: none;"
        >

            <h2>

                📊 Historial de ventas

            </h2>


            <label for="fechaFiltro">

                Seleccionar fecha:

            </label>


            <input
                type="date"
                id="fechaFiltro"
                onchange="filtrarVentasPorFecha()"
            >


            <button onclick="mostrarVentasDeHoy()">

                📅 Ver ventas de hoy

            </button>


            <div id="ventasDelDia"></div>


            <h3 id="totalDia">

                Total vendido: $0

            </h3>

        </div>

    </div>


    <!-- ==========================================
         REPORTE MENSUAL
    ========================================== -->

    <div class="tarjeta">

        <button onclick="alternarReporte()">

            📊 Ver / ocultar reporte mensual

        </button>


        <div
            id="reporteMensualContainer"
            style="display: none;"
        >

            <h2>

                📊 Reporte mensual

            </h2>


            <label for="mesReporte">

                Seleccionar mes:

            </label>


            <input
                type="month"
                id="mesReporte"
            >


            <button onclick="generarReporteMensual()">

                📊 Ver reporte

            </button>


            <div id="reporteMensual"></div>

        </div>

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="script.js?v=4"></script>


</body>

</html>
