<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Flor de Pasta</title>


<style>

/* ==========================================
   BASE
========================================== */

* {
    box-sizing: border-box;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    color: #171717;
    font-family: Arial, Helvetica, sans-serif;
}


/* ==========================================
   APP
========================================== */

.app {
    width: 100%;
    max-width: 1250px;
    margin: 0 auto;
}


/* ==========================================
   ENCABEZADO
========================================== */

.encabezado {
    width: 100%;
    background: #ffffff;
    border-radius: 20px;
    padding: 16px 20px;
    margin-bottom: 18px;
    text-align: center;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
}

.encabezado h1 {
    margin: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    font-size: 30px;
    font-weight: 800;
}

.encabezado img {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.subtitulo {
    margin-top: 4px;
    color: #666;
    font-size: 15px;
}


/* ==========================================
   DOS COLUMNAS
========================================== */

.contenedorColumnas {

    display: grid;

    grid-template-columns:
        minmax(0, 1.65fr)
        minmax(300px, 0.8fr);

    gap: 18px;

    align-items: start;
}


/* ==========================================
   COLUMNAS
========================================== */

.columnaIzquierda,
.columnaDerecha {
    min-width: 0;
}


/* ==========================================
   TARJETAS
========================================== */

.tarjeta {

    width: 100%;

    background: #ffffff;

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 14px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.07);
}

.tarjeta h2 {

    margin-top: 0;
    margin-bottom: 10px;

    font-size: 20px;
}

.tarjeta h3 {

    margin-top: 13px;
    margin-bottom: 7px;

    font-size: 17px;
}


/* ==========================================
   INPUTS
========================================== */

input,
select {

    width: 100%;
    min-width: 0;

    padding: 11px 12px;

    margin-top: 5px;
    margin-bottom: 8px;

    border: 1px solid #d5d5d5;

    border-radius: 10px;

    font-size: 16px;

    background: #ffffff;
    color: #171717;
}

input:focus,
select:focus {

    outline: none;

    border-color: #f47b20;

    box-shadow:
        0 0 0 3px rgba(244,123,32,0.15);
}

label {

    font-weight: 600;
    font-size: 14px;
}


/* ==========================================
   BOTONES
========================================== */

button {

    width: 100%;

    min-height: 44px;

    padding: 11px 14px;

    margin-top: 5px;
    margin-bottom: 5px;

    border: none;

    border-radius: 10px;

    background: #171717;
    color: #ffffff;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.1s,
        opacity 0.2s;
}

button:hover {
    opacity: 0.9;
}

button:active {
    transform: scale(0.98);
}


/* ==========================================
   BOTONES PRINCIPALES
========================================== */

button[onclick="abrirEscaner()"],
button[onclick="agregarVenta()"],
button[onclick="finalizarVenta()"] {

    background: #f47b20;
    color: #ffffff;
}


/* ==========================================
   ESCÁNER
========================================== */

#lectorCodigo {

    width: 100%;

    margin-top: 10px;

    padding: 12px;

    background: #171717;

    border-radius: 14px;

    text-align: center;
}

#reader {

    width: 100% !important;

    max-width: 400px;

    margin: auto;

    border-radius: 10px;

    overflow: hidden;
}

#lectorCodigo button {

    background: #ffffff;
    color: #171717;
}


/* ==========================================
   CÓDIGO + BUSCAR
========================================== */

.codigoBusqueda {
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
}

.codigoBusqueda input {
    flex: 1;
    width: auto;
    margin: 0;
}

.codigoBusqueda button {
    width: auto;
    min-width: 90px;
    min-height: 44px;
    margin: 0;
    padding: 10px 14px;
    white-space: nowrap;
}


/* ==========================================
   RESULTADO PRODUCTO
========================================== */

#resultado {

    width: 100%;

    margin-top: 9px;
}

#resultado h3 {

    margin-bottom: 4px;

    color: #f47b20;
}


/* ==========================================
   CANTIDAD
========================================== */

#cantidadProducto {

    width: 100%;

    margin-top: 10px;

    padding: 13px;

    background: #fafafa;

    border-radius: 13px;

    border: 1px solid #eeeeee;
}

#cantidad {

    margin-bottom: 4px;
}

#unidadCantidad {

    display: inline-block;

    margin-bottom: 7px;
}


/* =====================================================
   VENTA ACTUAL — DISEÑO COMPACTO
===================================================== */

#venta {

    width: 100%;

    margin-top: 7px;
}

#venta > div {

    width: 100%;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    gap: 7px;

    align-items: center;

    background: #fafafa;

    border: 1px solid #e9e9e9;

    border-left: 3px solid #f47b20;

    border-radius: 8px;

    padding: 6px 8px;

    margin-bottom: 4px;

    font-size: 15px;

    line-height: 1.15;

    overflow-wrap: break-word;
}

#venta > div p {

    margin: 1px 0;

    line-height: 1.15;
}

#venta > div strong {

    font-size: 16px;
}

#venta > div button {

    width: auto;

    min-width: 32px;

    min-height: 30px;

    padding: 4px 7px;

    margin: 0;

    border-radius: 7px;

    background: #171717;

    font-size: 11px;

    line-height: 1;

    white-space: nowrap;
}


/* ==========================================
   TOTAL
========================================== */

#total {

    width: 100%;

    background: #171717;

    color: #ffffff;

    padding: 11px;

    border-radius: 10px;

    text-align: center;

    margin-top: 8px;

    margin-bottom: 6px;

    font-size: 21px;
}


/* ==========================================
   VACIAR VENTA
========================================== */

button[onclick="vaciarVenta()"] {

    background: #eeeeee;

    color: #171717;

    min-height: 40px;

    margin-top: 3px;
}


/* ==========================================
   BLOQUE DE PAGO
========================================== */

#bloquePago {

    width: 100%;

    margin-top: 12px;

    text-align: left;
}


/* ==========================================
   MEDIO DE PAGO
========================================== */

#medioPago {

    width: auto;

    min-width: 180px;

    margin-bottom: 8px;
}


/* ==========================================
   FINALIZAR VENTA
========================================== */

button[onclick="finalizarVenta()"] {

    width: auto;

    min-width: 180px;

    min-height: 50px;

    padding: 13px 20px;

    font-size: 17px;

    margin-top: 7px;

    display: block;
}


/* ==========================================
   VENTA A RESTAURANTE
========================================== */

#ventaRestaurante {

    width: 24px !important;
    height: 24px;

    margin: 0;

    flex-shrink: 0;
}


/* ==========================================
   DATOS RESTAURANTE
========================================== */

#datosRestaurante {

    width: 100%;

    background: #fafafa;

    border: 1px solid #eeeeee;

    border-radius: 12px;

    padding: 11px;

    margin-top: 7px;
}

#datosRestaurante h3 {

    margin-top: 5px;
}


/* ==========================================
   RESUMEN PAGO
========================================== */

#resumenPago {

    width: 100%;

    overflow-wrap: break-word;

    padding: 10px !important;

    margin-bottom: 10px !important;
}


/* ==========================================
   MENSAJES
========================================== */

#mensaje {

    text-align: center;

    font-weight: 600;

    margin-top: 7px;

    padding: 5px;

    overflow-wrap: break-word;
}

#cargandoPrecios {

    text-align: center;

    padding: 7px;
}


/* ==========================================
   CUENTAS CORRIENTES
========================================== */

#cuentasCorrientesSection {

    width: 100%;

    overflow: hidden;

    margin-top: 8px;
}

#listaCuentasCorrientes {

    width: 100%;

    max-height: 550px;

    overflow-y: auto;

    overflow-wrap: break-word;
}


/* ==========================================
   HISTORIAL
========================================== */

#historialVentas {

    width: 100%;

    margin-top: 10px;

    background: #ffffff;

    padding: 15px;

    border-radius: 14px;

    overflow: hidden;
}

#historialVentas h2 {

    color: #171717;

    border-bottom:
        3px solid #f47b20;

    padding-bottom: 8px;
}

#ventasDelDia > div {

    width: 100%;

    background: #fafafa;

    border-radius: 10px;

    padding: 10px;

    margin-bottom: 8px;

    border: 1px solid #eeeeee;

    overflow-wrap: break-word;
}

#ventasDelDia button {

    font-size: 13px;

    padding: 8px;
}

#totalDia {

    width: 100%;

    background: #f47b20;

    color: #ffffff;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    overflow-wrap: break-word;
}


/* ==========================================
   REPORTE MENSUAL
========================================== */

#reporteMensualContainer {

    width: 100%;

    margin-top: 10px;

    background: #ffffff;

    padding: 15px;

    border-radius: 14px;

    overflow: hidden;
}

#reporteMensualContainer h2 {

    color: #171717;

    border-bottom:
        3px solid #f47b20;

    padding-bottom: 8px;
}

#reporteMensual {

    width: 100%;

    margin-top: 10px;

    line-height: 1.5;

    overflow-wrap: break-word;
}

#reporteMensual p {

    background: #fafafa;

    padding: 9px;

    border-radius: 9px;
}


/* ==========================================
   SEPARADORES
========================================== */

hr {

    border: none;

    border-top:
        1px solid #e5e5e5;

    margin: 16px 0;
}


/* ==========================================
   PANTALLAS MEDIANAS
========================================== */

@media (max-width: 950px) and (min-width: 701px) {

    .contenedorColumnas {

        grid-template-columns:
            minmax(0, 1.35fr)
            minmax(260px, 0.8fr);

        gap: 14px;
    }

    body {

        padding: 15px;
    }

    .tarjeta {

        padding: 14px;
    }

    #venta > div {

        font-size: 12px;

        padding: 5px 7px;
    }

    #venta > div button {

        min-height: 28px;

        padding: 4px 6px;

        font-size: 10px;
    }
}


/* ==========================================
   CELULAR
========================================== */

@media (max-width: 700px) {

    body {

        padding: 10px;
    }

    .app {

        max-width: none;
    }


    /* ENCABEZADO */

    .encabezado {

        padding: 13px 10px;

        border-radius: 16px;

        margin-bottom: 12px;
    }

    .encabezado h1 {

        font-size: 24px;

        gap: 7px;
    }

    .encabezado img {

        width: 55px;
        height: 55px;
    }

    .subtitulo {

        font-size: 14px;
    }


    /* UNA SOLA COLUMNA */

    .contenedorColumnas {

        display: block;
    }

    .columnaIzquierda,
    .columnaDerecha {

        width: 100%;
    }


    /* TARJETAS */

    .tarjeta {

        padding: 14px;

        border-radius: 15px;

        margin-bottom: 12px;
    }

    .tarjeta h2 {

        font-size: 20px;
    }

    .tarjeta h3 {

        font-size: 17px;
    }


    /* INPUTS */

    input,
    select {

        min-height: 48px;

        font-size: 16px;
    }


    /* BOTONES */

    button {

        min-height: 48px;

        font-size: 16px;
    }


    /* ESCÁNER */

    #lectorCodigo {

        padding: 10px;
    }

    #reader {

        max-width: 100%;
    }


    /* VENTA COMPACTA EN CELULAR */

    #venta > div {

        padding: 9px;

        margin-bottom: 5px;

        font-size: 16px;

        gap: 6px;
    }

    #venta > div button {

        min-height: 32px;

        padding: 5px 7px;

        font-size: 11px;
    }


    /* TOTAL */

    #total {

        font-size: 22px;

        padding: 15px 10px;
    }


    /* HISTORIAL / REPORTE */

    #historialVentas,
    #reporteMensualContainer {

        padding: 14px;
    }
}


/* ==========================================
   CELULARES MUY ANGOSTOS
========================================== */

@media (max-width: 380px) {

    body {

        padding: 7px;
    }

    .tarjeta {

        padding: 12px;
    }

    .encabezado h1 {

        font-size: 22px;
    }

    .encabezado img {

        width: 50px;
        height: 50px;
    }

    .tarjeta h2 {

        font-size: 18px;
    }

    button {

        font-size: 15px;
    }

    #total {

        font-size: 20px;
    }

   #venta > div {

    font-size: 15px;

    padding: 7px;
    }

    #venta > div button {

        min-width: 30px;

        min-height: 30px;

        font-size: 10px;
    }
}

</style>

</head>


<body>


<div class="app">


<!-- ==========================================
     ENCABEZADO
========================================== -->

<div class="encabezado">

    <h1>

        <img
            src="Logo.png"
            alt="Flor de Pasta"
        >

        Flor de Pasta

    </h1>

    <div class="subtitulo">

        Registro de ventas

    </div>

</div>



<!-- ==========================================
     DOS COLUMNAS
========================================== -->

<div class="contenedorColumnas">


<!-- =====================================================
     COLUMNA IZQUIERDA
===================================================== -->

<div class="columnaIzquierda">


<!-- ==========================================
     BUSCAR PRODUCTO
========================================== -->

<div class="tarjeta">

    <h2>🔎 Buscar producto</h2>

    <div class="codigoBusqueda">

        <input
            type="text"
            id="codigo"
            placeholder="Escribí el código Ej: F01"
        >

        <button onclick="buscarProducto()">

            🔎 Buscar

        </button>

    </div>


    <button onclick="abrirEscaner()">

        Escanear código

    </button>


    <div
        id="lectorCodigo"
        style="display: none;"
    >

        <div id="reader"></div>


        <button onclick="cerrarEscaner()">

            ❌ Cerrar escáner

        </button>

    </div>


    <div id="resultado"></div>


    <div
        id="cantidadProducto"
        style="display: none;"
    >
 
        <label for="cantidad">

            Cantidad:

        </label>


        <input
            type="text"
            id="cantidad"
            value="1"
            inputmode="decimal"
            placeholder="Ej: 4"
        >

<span id="unidadCantidad">

    unidad

</span>


<div
    id="formaVentaContainer"
    style="display: none; margin-top: 8px;"
>

    <label for="formaVenta">

        Forma de venta:

    </label>


<select id="formaVenta">

    <option value="unidad">
        Unidad
    </option>

    <option value="docena">
        Docena
    </option>

</select>

</div>


<button onclick="agregarVenta()">

    ➕ Agregar a la venta

</button>

    </div>

</div>



<!-- ==========================================
     ACTUALIZAR PRECIOS
========================================== -->

<div class="tarjeta">

    <button
        onclick="actualizarPreciosDesdeGoogle()"
    >

        🔄 Actualizar precios

    </button>


    <div id="mensaje"></div>


    <div
        id="cargandoPrecios"
        style="display: none;"
    >

        ⏳ Actualizando precios...

    </div>

</div>



<!-- ==========================================
     VENTA ACTUAL
========================================== -->

<div class="tarjeta">

    <h2>

        Detalle de la venta

    </h2>


    <div id="venta"></div>


    <h2 id="total">

        TOTAL: $0

    </h2>


    <button onclick="vaciarVenta()">

        🗑️ Vaciar venta

    </button>


    <!-- ==========================================
         PAGO VENTA PARTICULAR
         Este bloque se mueve automáticamente
         cuando se selecciona restaurante.
    ========================================== -->

    <div id="pagoVentaParticular">

        <div id="bloquePago">

            <h3>

                Medio de pago

            </h3>


            <select id="medioPago">

                <option value="Efectivo">

                    Efectivo

                </option>

                <option value="Transferencia">

                    Transferencia

                </option>

                <option value="Tarjeta">

                    Tarjeta

                </option>

            </select>


            <button onclick="finalizarVenta()">

                FINALIZAR VENTA

            </button>

        </div>

    </div>

</div>


</div>



<!-- =====================================================
     COLUMNA DERECHA
===================================================== -->

<div class="columnaDerecha">


<!-- ==========================================
     CUENTAS CORRIENTES
========================================== -->

<div class="tarjeta">

    <button
        id="botonCuentasCorrientes"
        onclick="alternarCuentasCorrientes()"
    >

        Ver cuentas corrientes

    </button>


    <div
        id="cuentasCorrientesSection"
        hidden
    >

        <h2>

            Cuentas corrientes

        </h2>


        <div id="listaCuentasCorrientes">

            <p style="text-align:center;">

                ⏳ Cargando cuentas corrientes...

            </p>

        </div>

    </div>

</div>



<!-- ==========================================
     HISTORIAL
========================================== -->

<div class="tarjeta">

    <button
        id="botonHistorial"
        onclick="alternarHistorial()"
    >

        Ver historial de ventas

    </button>


    <div
        id="historialVentas"
        hidden
    >

        <h2>

            Historial de ventas

        </h2>


        <label for="fechaFiltro">

            Seleccionar fecha:

        </label>


        <input
            type="date"
            id="fechaFiltro"
            onchange="filtrarVentasPorFecha()"
        >


        <div id="ventasDelDia"></div>


        <h3 id="totalDia">

            Total vendido: $0

        </h3>

    </div>

</div>



<!-- ==========================================
     REPORTE MENSUAL
========================================== -->

<div class="tarjeta">

    <button
        id="botonReporte"
        onclick="alternarReporte()"
    >

        Ver reporte mensual

    </button>


    <div
        id="reporteMensualContainer"
        hidden
    >

        <h2>

            Reporte mensual

        </h2>


        <label for="mesReporte">

            Seleccionar mes:

        </label>


        <input
            type="month"
            id="mesReporte"
            onchange="generarReporteMensual()"
        >


        <div id="reporteMensual"></div>

    </div>

</div>



<!-- ==========================================
     VENTA A RESTAURANTE
========================================== -->

<div class="tarjeta">

    <label
        style="
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: bold;
        "
    >

        <input
            type="checkbox"
            id="ventaRestaurante"
            onchange="actualizarModoVenta()"
            style="
                width: 24px;
                height: 24px;
                margin: 0;
                flex-shrink: 0;
            "
        >

        <span>

            Venta a restaurante

        </span>

    </label>


    <!-- ==========================================
         DATOS RESTAURANTE
    ========================================== -->

    <div
        id="datosRestaurante"
        style="display: none;"
    >

        <h3>

            Cliente

        </h3>


        <select id="cliente">

            <option value="">

                Seleccionar cliente

            </option>

        </select>


        <h3>

            Pago inicial

        </h3>


        <input
            type="text"
            id="montoPagado"
            value=""
            inputmode="decimal"
            placeholder="Ingrese el monto"
            oninput="actualizarResumenPago()"
        >


        <div
            id="resumenPago"
            style="
                background: #ffffff;
                border: 1px solid #eeeeee;
                border-radius: 10px;
                padding: 10px;
                margin-bottom: 10px;
            "
        >

            <strong>

                Saldo pendiente: $0

            </strong>

        </div>


        <!-- ==========================================
             ACÁ SE MUEVE EL BLOQUE DE PAGO
             CUANDO ES RESTAURANTE
        ========================================== -->

        <div id="pagoRestaurante"></div>

    </div>

</div>


</div>


</div>


<!-- ==========================================
     LIBRERÍAS
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="script.js?v=8"></script>


</body>

</html>
